<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="/static/styles/main.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <title>User Dashboard</title>
    </head>
<body>
    <div class="my_container">
        <div class="center"><h1>A-Z Household Services</h1></div>
        <div class="my_panel">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                  <a class="navbar-brand" href="#">Welcome to Customer</a>
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                  </button>
                  <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                      <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link" href="#">Search</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link" href="#">Summary</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link" href="#">Logout</a>
                      </li>
                    </ul>
                  </div>
                </div>
            </nav>
        </div>

        <!-- Service Options -->
        <div class="container mt-4">
            <h2 class="text-center">Looking For?</h2>
            <div class="d-flex justify-content-center gap-3">
                <button class="btn btn-primary">Electricals</button>
                <button class="btn btn-primary">Plumbing</button>
                <button class="btn btn-primary">House Cleaning</button>
                <button class="btn btn-primary">AC Repair</button>
            </div>
        </div>

        <!-- Service History -->
        <div class="container mt-5">
            <h2 class="text-center">Service History</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Service Name</th>
                        <th>Professional Name</th>
                        <th>Phone No.</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Example rows -->
                    <tr>
                        <td>1</td>
                        <td>Electrical Repair</td>
                        <td>John Doe</td>
                        <td>123-456-7890</td>
                        <td>Requested</td>
                        <td>
                            <button class="btn btn-warning btn-sm">Close it?</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Plumbing</td>
                        <td>Jane Smith</td>
                        <td>987-654-3210</td>
                        <td>Closed</td>
                        <td>
                            <button class="btn btn-success btn-sm" disabled>Closed</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFyKCQAqj5xBO4El1kQbsIW7rikj3aohQ0p3NOFhvGSIBlFT0p8CKzFSJw" crossorigin="anonymous"></script>
</body>
</html>
