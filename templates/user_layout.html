<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="/static/styles/main.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <title>User Dashboard</title>
    </head>
    <body>
        <div class="my_container">
            <div class="center"><h1>A-Z Household Services</h1></div>
            <div class="my_panel">
                <nav class="navbar navbar-expand-lg navbar-light bg-light">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="#">Welcome {{name}}</a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarNav">
                            <ul class="navbar-nav me-auto">
                                <li class="nav-item">
                                    <a class="nav-link active" href="{{ url_for('user_dashboard', name=name) }}">Home</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="{{ url_for('user_search',name=name) }}">Search</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="{{ url_for('user_summary', name=name) }}">Summary</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="{{ url_for('home') }}">Logout</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
                {%block content%}
                {%endblock%}
            </div>
        </div>
    </body>
</html>
