{% extends "professional_layout.html" %}
{% block content %}

<div class="container">
    <h2>Professional Summary</h2>
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">User Ratings Summary</h5>
                    <img src="{{ url_for('static', filename='images/prof_ratings_summary.jpeg') }}" class="img-fluid" alt="User Ratings Chart">
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Service Status Summary</h5>
                    <img src="{{ url_for('static', filename='images/prof_services_summary.jpeg') }}" class="img-fluid" alt="Service Status Chart">
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
