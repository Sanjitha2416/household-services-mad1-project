{%extends "admin_layout.html"%}
{%block content%}

            <div class="center"><h3>+New Service</h3></div>
            <form action="{{ url_for('add_service', name=name) }}" method="POST">
            <div class="input_formy">
                <div class="mb-3">
                    <label for="name" class="form-label">Service Name</label>
                    <input type="text" class="form-control" name="name" id="name" placeholder="Cleaning">
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <input type="text" class="form-control" name="description" id="description" placeholder="This includes bathroom deep cleaning, kitchen cleaning, etc.">
                </div>
                <div class="mb-3">
                    <label for="base_price" class="form-label">Price</label>
                    <input type="integer" class="form-control" name="base_price" id="base_price" placeholder="2999">
                </div>
                
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <a href="admin_dashboard.html" type="button" class="btn btn-primary">Cancel</a>
                </div>
            </div> 
            </form>
            {%endblock%}
