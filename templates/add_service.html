{%extends "admin_layout.html"%}
{%block content%}

            <div class="center"><h3>+New Service</h3></div>
            <form method="POST" action="{{ url_for('add_service', name=name) }}">
                <label for="name">Service Name:</label>
                <input type="text" id="name" name="name" required>
              
                <label for="description">Service Description:</label>
                <textarea id="description" name="description" required></textarea>
              
                <div id="subcategories">
                  <label>Subcategories:</label>
                  <div class="subcategory">
                    <input type="text" name="subcat_name[]" placeholder="Subcategory Name" required>
                    <textarea name="subcat_desc[]" placeholder="Subcategory Description" required></textarea>
                    <input type="number" name="subcat_price[]" placeholder="Subcategory Price" required>
                  </div>
                </div>
              
                <button type="button" onclick="addSubcategory()">Add Another Subcategory</button>
                <button type="submit">Submit</button>
              </form>
              
              <script>
              function addSubcategory() {
                const container = document.getElementById('subcategories');
                const subcatDiv = document.createElement('div');
                subcatDiv.classList.add('subcategory');
                subcatDiv.innerHTML = `
                  <input type="text" name="subcat_name[]" placeholder="Subcategory Name" required>
                  <textarea name="subcat_desc[]" placeholder="Subcategory Description" required></textarea>
                  <input type="number" name="subcat_price[]" placeholder="Subcategory Price" required>
                `;
                container.appendChild(subcatDiv);
              }
              </script>
              
{%endblock%}
