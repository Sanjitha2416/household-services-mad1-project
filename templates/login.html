<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="/static/styles/main.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <title>Login</title>
    </head>
<body>
    <div class="my_container">
        <div class="center"><h1>A-Z Household Services</h1></div>
        <div class="my_panel">
            <div class="center"><h3>Login</h3></div>
            <form action="/login" method="POST">
            <div class="input_form">
                <div class="mb-3">
                    <label for="user_name" class="form-label">Registered E-Mail ID</label>
                    <input type="email" class="form-control" name="user_name" id="exampleFormControlInput1" placeholder="xyz@gmail.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" id="exampleFormControlInput1" placeholder="******">
                </div>
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">Login</button>
                    New user? Click here -><a href="/register">Signup</a>
                    Or <a href="/register_professional">Register as a professional</a>
                    <div class="error_msg">{{msg}}</div>
                </div>
            </div> 
            </form>
        </div>
    </div>   
</body>
</html>
