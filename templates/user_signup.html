<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="/static/styles/main.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <title>Customer Signup</title>
    </head>
<body>
    <div class="my_container">
        <div class="center"><h1>A-Z Household Services</h1></div>
        <div class="my_panel">
            <div class="center"><h3>Customer Signup</h3></div>
            <form action="/register" method="POST">
            <div class="input_formy">
                <div class="mb-3">
                    <label for="user_name" class="form-label">E-Mail ID (User Name)</label>
                    <input type="email" class="form-control" name="user_name" id="exampleFormControlInput1" placeholder="xyz@gmail.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" id="exampleFormControlInput1" placeholder="******">
                </div>
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" id="name" placeholder="XYZ">
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" name="address" id="address" placeholder="No.42, Adyar, Chennai">
                </div>
                <div class="mb-3">
                    <label for="pincode" class="form-label">Pincode</label>
                    <input type="integer" class="form-control" name="pincode" id="pincode" placeholder="600020">
                </div>
                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">Register</button>
                    Existing user?<a href="/login">Login</a>
                    <div class="center">{{msg}}</div>
                </div>
            </div> 
            </form>
        </div>
    </div>   
</body>
</html>
