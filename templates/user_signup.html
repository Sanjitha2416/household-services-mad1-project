<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="/household-services-mad1-project/static/styles/main.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <title>Customer Signup</title>
    </head>
<body>
    <div class="my_container">
        <div class="center"><h1>A-Z Household Services</h1></div>
        <div class="my_panel">
            <div class="center"><h3>Customer Signup</h3></div>
            <div class="input_form">
                <div class="mb-3">
                    <label for="user_name" class="form-label">E-Mail ID (User Name)</label>
                    <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="xyz@gmail.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="exampleFormControlInput1" placeholder="******">
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="XYZ">
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" placeholder="No.42, Adyar, Chennai-20">
                </div>
                <div class="mb-3">
                    <button type="button" class="btn btn-primary">Register</button>
                    Existing user?<a href="C:\App Dev 1\household-services-mad1-project\templates\login.html">Login</a>
                </div>
            </div> 
        </div>
    </div>   
</body>
</html>
