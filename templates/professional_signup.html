<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/styles/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Professional Signup</title>
</head>
<body>
    <div class="my_container">
        <div class="center"><h1>A-Z Household Services</h1></div>
        <div class="my_panel">
            <div class="center"><h3>Service Professional Signup</h3></div>
            <form method="POST" action="/register_professional" enctype="multipart/form-data">
                <div class="input_formx">
                    <div class="row mb-3 align-items-center">
                        <label for="email" class="form-label">E-Mail ID (User Name)</label>
                        <div class="col-sm-9">
                            <input type="email" class="form-control" id="email" name="email" placeholder="xyz@gmail.com" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="password" class="form-label">Password</label>
                        <div class="col-sm-9">
                            <input type="password" class="form-control" id="password" name="password" placeholder="******" required>
                        </div>
                    </div>
                    
                    <div class="row mb-3 align-items-center">
                        <label for="name" class="form-label">Full Name</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="name" name="name" placeholder="XYZ" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="serviceName" class="form-label">Service Name</label>
                        <div class="col-sm-9">
                            <select class="form-select" id="serviceName" name="service" required>
                                <option selected disabled>Select available services...</option>
                                <option value="ac_servicing">AC Servicing</option>
                                <option value="cleaning">Home Cleaning</option>
                                <option value="electrical">Electrical Work</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mb-3 align-items-center">
                        <label for="experience" class="form-label">Experience (in yrs)</label>
                        <div class="col-sm-9">
                            <input type="number" class="form-control" id="experience" name="experience" placeholder="5" required>
                        </div>
                    </div>
                    
                    <div class="row mb-3 align-items-center">
                        <label for="address" class="form-label">Address</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" id="address" name="address" placeholder="No.42, Adyar, Chennai-20" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="pincode" class="form-label">Pincode</label>
                        <input type="integer" class="form-control" name="pincode" id="pincode" placeholder="600020">
                    </div>

                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary">Register</button>
                        Existing user? <a href="/login">Login</a>
                    </div>
                    {% if message %}
  <div class="alert alert-success">
    {{ message }}
    <a href="/login">Click here to log in</a>
  </div>
{% endif %}
                </div>
            </form> 
        </div>
    </div>   
</body>
</html>
