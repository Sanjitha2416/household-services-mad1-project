{% extends "admin_layout.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Edit Service</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Service Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ service.name }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" name="description" required>{{ service.description }}</textarea>
        </div>
        <div id="subcategories">
            <label>Subcategories:</label>
            {% for subcategory in subcategories %}
            <div class="subcategory">
                <input type="text" name="subcat_name[]" value="{{ subcategory.name }}" placeholder="Subcategory Name" required>
                <textarea name="subcat_desc[]" placeholder="Subcategory Description" required>{{ subcategory.description }}</textarea>
                <input type="number" name="subcat_price[]" value="{{ subcategory.price }}" placeholder="Subcategory Price" required>
            </div>
            {% endfor %}
        </div>

        <button type="button" onclick="addSubcategory()">Add Another Subcategory</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin_dashboard', name='admin') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script>
function addSubcategory() {
    const container = document.getElementById('subcategories');
    const subcatDiv = document.createElement('div');
    subcatDiv.classList.add('subcategory');
    subcatDiv.innerHTML = `
      <input type="text" name="subcat_name[]" placeholder="Subcategory Name" required>
      <textarea name="subcat_desc[]" placeholder="Subcategory Description" required></textarea>
      <input type="number" name="subcat_price[]" placeholder="Subcategory Price" required>
    `;
    container.appendChild(subcatDiv);
}
</script>
{% endblock %}
