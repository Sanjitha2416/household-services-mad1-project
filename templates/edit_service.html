{% extends "admin_layout.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Edit Service</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Service Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ service.name }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" name="description" required>{{ service.description }}</textarea>
        </div>
        <div class="form-group">
            <label for="base_price">Base Price</label>
            <input type="number" class="form-control" id="base_price" name="base_price" value="{{ service.base_price }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin_dashboard', name='admin') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
